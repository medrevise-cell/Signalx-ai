<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignalX AI</title>
<style>
:root{--bg:#07101d;--panel:#0d1726;--panel2:#101d2f;--line:#203049;--text:#eef5ff;--muted:#91a1b8;--cyan:#29d3ff;--green:#35e69a;--yellow:#ffd166;--red:#ff5577;--purple:#a987ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#091321;padding:18px 12px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;padding:8px 10px 20px}.brand b{color:var(--cyan)}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#b9c5d7;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#14243a;color:#fff}.nav .hot{color:#ff9b55}.main{padding:20px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.title{font-size:25px;font-weight:800}.subtitle{color:var(--muted);margin-top:5px}.pill{border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--green);background:#0a1b1b}.grid{display:grid;grid-template-columns:1.45fr .9fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.select,.btn{background:#111f32;border:1px solid #2b405d;color:#fff;border-radius:8px;padding:10px 12px}.btn{cursor:pointer}.btn.primary{background:#116f78;border-color:#1ba8b7}.btn.run{background:#0c7751;border-color:#1abf82}.btn.stop{background:#63243a;border-color:#ad3b5d}.decision{display:flex;align-items:center;justify-content:space-between;gap:14px}.big{font-size:48px;font-weight:900;letter-spacing:-2px}.wait{color:var(--yellow)}.trade{color:var(--green)}.no{color:var(--red)}.stop{color:#ff6f91}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.stat{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:9px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:19px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:12px;background:#0b1523;border:1px solid var(--line);border-radius:9px}.metric label{color:var(--muted);display:block;font-size:11px}.metric b{font-size:20px}.section{margin-top:14px}.section h3{margin:0 0 10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:70px 1fr 55px;align-items:center;gap:8px}.bar{height:8px;background:#17253a;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple))}.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.digit{padding:10px 5px;text-align:center;background:#0b1523;border:1px solid var(--line);border-radius:7px}.digit small{display:block;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase}.tag{padding:4px 7px;border-radius:6px;background:#16263b}.tag.good{color:var(--green)}.tag.wait{color:var(--yellow)}.tag.bad{color:var(--red)}.log{height:160px;overflow:auto;background:#07101a;border-radius:8px;padding:10px;color:#9fb1c8;font:12px monospace}.hidden{display:none}.hero{background:linear-gradient(135deg,#0d1b2e,#10192b);border-color:#263c5c}.large-action{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.feature{min-height:130px}.feature h3{margin-top:0}.feature p{color:var(--muted);line-height:1.5}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.range{height:8px;background:#16243a;border-radius:99px}.range i{display:block;height:100%;width:0;background:var(--green);border-radius:99px}.foot{color:#71839b;font-size:12px;margin-top:14px}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.grid,.twocol{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.stats,.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main{padding:12px}.nav{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.digits{grid-template-columns:repeat(5,1fr)}.big{font-size:38px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">SIGNALX <b>AI</b></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">Dashboard</div><div class="subtitle" id="subtitle">Research-first trading intelligence suite</div></div><div class="pill" id="connection">● BACKEND OFFLINE</div></div><div id="view"></div></main></div>
<script>
const navItems=['Dashboard','Bot Builder','Free Bots','Pro Scanner','Strategy Pro','Speedbot','AI Software','Auto Trader','Analysis Tool','Manual Trade','Bulk Trade','Charts','Copy Trade','Risk Calculator','Trade Academy'];
const nav=document.getElementById('nav'),view=document.getElementById('view');let current='Dashboard';
navItems.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>show(x);nav.appendChild(b)});
let state={symbol:'1HZ100V',count:1000,ticks:[],decision:'NO TRADE',validation:null,drift:null,ws:null};
const markets=[['1HZ100V','Volatility 100 (1s) Index'],['1HZ75V','Volatility 75 (1s) Index'],['1HZ50V','Volatility 50 (1s) Index'],['1HZ25V','Volatility 25 (1s) Index'],['1HZ10V','Volatility 10 (1s) Index']];
function shell(title,body){document.getElementById('pageTitle').textContent=title;document.getElementById('subtitle').textContent='Fast research scanner · real-data decision engine';view.innerHTML=body}
function show(x){current=x;[...nav.children].forEach(b=>b.classList.toggle('active',b.textContent===x)); if(x==='Dashboard')dashboard(); else if(x==='Analysis Tool')analysis(); else if(x==='Pro Scanner')scanner(); else if(x==='Speedbot')speed(); else if(x==='Risk Calculator')risk(); else if(x==='Charts')charts(); else feature(x)}
function dashboard(){shell('Dashboard',`<div class="grid"><div class="card hero"><h2>SignalX Command Center</h2><p class="subtitle">One workspace for research, strategy validation, automation controls and execution preparation.</p><div class="stats"><div class="stat"><span>Markets</span><strong>5</strong></div><div class="stat"><span>Mode</span><strong>Research</strong></div><div class="stat"><span>Speed</span><strong>FAST</strong></div><div class="stat"><span>Orders</span><strong>0</strong></div></div></div><div class="card"><h3>System</h3><p>Live market data is connected through the SignalX backend. Trading remains disabled until explicitly enabled and authenticated.</p><button class="btn primary" onclick="show('Analysis Tool')">Open Analysis Tool</button></div></div><div class="section cards">${navItems.slice(1).map((n,i)=>`<div class="card feature"><h3>${n}</h3><p>${desc(n)}</p><button class="btn" onclick="show('${n}')">Open</button></div>`).join('')}</div>`)}
function desc(n){return ({'Bot Builder':'Create rule-based bots from validated strategies.','Free Bots':'Browse research templates and free strategy presets.','Pro Scanner':'Scan multiple markets and rank research candidates.','Strategy Pro':'Backtest, unseen validation and walk-forward analysis.','Speedbot':'Fast decision monitor for live tick conditions.','AI Software':'Explain signals, evidence, risks and invalidation conditions.','Auto Trader':'Controlled automation layer; disabled until authentication and safeguards are enabled.','Analysis Tool':'Detailed Over/Under, Match/Differ, Even/Odd and Rise/Fall research.','Manual Trade':'Prepare and review a trade before execution.','Bulk Trade':'Plan multiple actions with strict risk controls.','Charts':'Real-time and historical price/tick visualisation.','Copy Trade':'Research and monitor strategy-copy workflows.','Risk Calculator':'Stake, payout, break-even, drawdown and losing-streak analysis.','Trade Academy':'Learn probability, validation and disciplined risk management.'}[n]||'SignalX module.')}
function controls(){return `<div class="controls"><select class="select" id="market">${markets.map(m=>`<option value="${m[0]}" ${state.symbol===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select><select class="select" id="count"><option>1000</option><option>5000</option><option>10000</option></select><button class="btn primary" onclick="loadHistory()">⚡ Scan</button><button class="btn" onclick="startLive()">Start Live</button><button class="btn stop" onclick="stopLive()">Stop</button></div>`}
function analysis(){shell('Analysis Tool',`${controls()}<div class="grid"><div class="card hero"><div class="decision"><div><div class="subtitle">CURRENT RESEARCH DECISION</div><div id="decision" class="big no">NO TRADE</div><div id="reason" class="subtitle">Waiting for real market data</div></div><div class="pill">FAST</div></div><div class="stats"><div class="stat"><span>Ticks analysed</span><strong id="ticks">0</strong></div><div class="stat"><span>Validation</span><strong id="validation">—</strong></div><div class="stat"><span>Drift</span><strong id="drift">—</strong></div><div class="stat"><span>Risk</span><strong id="risk">—</strong></div></div><div class="section"><h3>⚡ High-Speed Decision</h3><div class="large-action"><button class="btn run" id="runBtn" disabled>RUN BOT</button><button class="btn stop">STOP</button></div><div class="foot">RUN BOT is only enabled after sufficient real data and validated criteria. No order is placed by this research interface.</div></div></div><div class="card"><h3>Market Research</h3><div id="metrics" class="metrics"></div></div></div><div class="section twocol"><div class="card"><h3>Digit Distribution</h3><div id="digits" class="digits"></div></div><div class="card"><h3>Pro Scanner</h3><div id="scanner">Loading...</div></div></div>`);}
function calc(prices){const ds=prices.map(q=>{let s=String(q);return Number(s.replace(/\D/g,'').slice(-1))}).filter(Number.isFinite);if(!ds.length)return null;let n=ds.length, over=ds.filter(x=>x>4).length/n*100, match=ds.filter((x,i)=>i&&x===ds[i-1]).length/Math.max(1,n-1)*100, odd=ds.filter(x=>x%2).length/n*100, rise=prices.slice(1).filter((q,i)=>q>prices[i]).length/Math.max(1,n-1)*100;let mid=Math.floor(n*.7),a=ds.slice(0,mid),b=ds.slice(mid);let p=x=>x.length?x.filter(v=>v>4).length/x.length*100:0;let validation=100-Math.abs(p(a)-p(b));let drift=Math.abs(p(a)-p(b));let edge=Math.max(Math.abs(over-50),Math.abs(odd-50),Math.abs(rise-50));let decision=(n>=1000&&validation>=96&&edge>=4&&drift<=5)?'RUN BOT':(edge>=2&&validation>=92)?'WAIT':'NO TRADE';return {ds,n,over,under:100-over,match,differ:100-match,odd,even:100-odd,rise,fall:100-rise,validation,drift,edge,decision}}
async function loadHistory(){state.symbol=document.getElementById('market').value;state.count=Number(document.getElementById('count').value);try{let r=await fetch(`/api/history?symbol=${state.symbol}&count=${state.count}`);let d=await r.json();if(d.error)throw Error(d.error);state.ticks=d.history?.prices||[];renderAnalysis(calc(state.ticks));document.getElementById('connection').textContent='● DERIV DATA CONNECTED';document.getElementById('connection').style.color='var(--green)'}catch(e){document.getElementById('connection').textContent='● BACKEND ERROR';document.getElementById('reason').textContent=e.message}}
function renderAnalysis(a){if(!a)return;document.getElementById('decision').textContent=a.decision;document.getElementById('decision').className='big '+(a.decision==='RUN BOT'?'trade':a.decision==='WAIT'?'wait':'no');document.getElementById('reason').textContent=a.decision==='RUN BOT'?'Validated research conditions detected.':a.decision==='WAIT'?'Conditions are developing; evidence is insufficient for action.':'No defensible research edge detected.';document.getElementById('ticks').textContent=a.n.toLocaleString();document.getElementById('validation').textContent=a.validation.toFixed(1)+'%';document.getElementById('drift').textContent=a.drift.toFixed(1)+'%';document.getElementById('risk').textContent=a.edge>=6?'HIGH':a.edge>=3?'MEDIUM':'LOW';document.getElementById('runBtn').disabled=a.decision!=='RUN BOT';let vals=[['Over 4',a.over],['Under 4',a.under],['Match',a.match],['Differ',a.differ],['Even',a.even],['Odd',a.odd],['Rise',a.rise],['Fall',a.fall]];document.getElementById('metrics').innerHTML=vals.map(v=>`<div class="metric"><label>${v[0]}</label><b>${v[1].toFixed(1)}%</b></div>`).join('');let c=Array(10).fill(0);a.ds.forEach(x=>c[x]++);document.getElementById('digits').innerHTML=c.map((v,i)=>`<div class="digit"><b>${i}</b><small>${(v/a.n*100).toFixed(1)}%</small></div>`).join('');document.getElementById('scanner').innerHTML=`<table><tr><th>Market</th><th>Signal</th><th>Validation</th><th>Action</th></tr>${markets.map(m=>`<tr><td>${m[1].replace(' Index','')}</td><td>${m[0]===state.symbol?a.decision:'—'}</td><td>${m[0]===state.symbol?a.validation.toFixed(1)+'%':'—'}</td><td><span class="tag ${m[0]===state.symbol?(a.decision==='RUN BOT'?'good':a.decision==='WAIT'?'wait':'bad'):'wait'}">${m[0]===state.symbol?a.decision:'WAIT'}</span></td></tr>`).join('')}</table>`}
function startLive(){stopLive();state.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/live');state.ws.onopen=()=>state.ws.send(JSON.stringify({symbol:state.symbol}));state.ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.tick){state.ticks.push(d.tick.quote);if(state.ticks.length>10000)state.ticks.shift();let a=calc(state.ticks);if(current==='Analysis Tool')renderAnalysis(a)}};state.ws.onclose=()=>{};}
function stopLive(){if(state.ws){state.ws.close();state.ws=null}}
function scanner(){shell('Pro Scanner',`<div class="card hero"><h2>Multi-Market Scanner</h2><p class="subtitle">The scanner ranks markets using the same research engine as Analysis Tool. No fabricated signals.</p><div class="section" id="scannerFull">${markets.map(m=>`<div class="card" style="margin-bottom:8px"><b>${m[1]}</b><span style="float:right" class="tag wait">WAITING FOR DATA</span><div class="range" style="margin-top:12px"><i style="width:0"></i></div></div>`).join('')}</div></div>`)}
function speed(){shell('Speedbot',`<div class="card hero"><h2>⚡ High-Speed Signal Engine</h2><p class="subtitle">Fast monitoring with strict evidence gates.</p><div class="stats"><div class="stat"><span>Execution speed</span><strong>FAST</strong></div><div class="stat"><span>Mode</span><strong>RESEARCH</strong></div><div class="stat"><span>Orders</span><strong>0</strong></div><div class="stat"><span>Risk guard</span><strong>ON</strong></div></div><div class="section cards"><div class="card feature"><h3>RUN BOT</h3><p>Only enabled after validation criteria are met.</p></div><div class="card feature"><h3>WAIT</h3><p>Conditions are developing but evidence is insufficient.</p></div><div class="card feature"><h3>STOP</h3><p>Stops the research signal when conditions deteriorate.</p></div></div></div>`)}
function risk(){shell('Risk Calculator',`<div class="cards"><div class="card"><h3>Stake</h3><input class="select" id="stake" type="number" value="10"></div><div class="card"><h3>Payout %</h3><input class="select" id="payout" type="number" value="95"></div><div class="card"><h3>Break-even</h3><strong id="be">51.28%</strong></div></div><div class="section card"><h3>Research Risk</h3><p>Break-even is payout-dependent and does not create a predictive edge. Use it alongside unseen validation, drift and drawdown controls.</p></div>`)}
function charts(){shell('Charts',`<div class="card"><h2>Live Price / Tick Chart</h2><canvas id="chart" height="330" style="width:100%"></canvas><p class="foot">Connect live data from Analysis Tool to populate the chart.</p></div>`)}
function feature(x){shell(x,`<div class="card hero"><h2>${x}</h2><p class="subtitle">${desc(x)}</p><div class="section cards"><div class="card feature"><h3>Research Mode</h3><p>Module structure is ready. Real data, validation and risk controls remain the source of truth.</p><button class="btn primary" onclick="show('Analysis Tool')">Open Signal Engine</button></div><div class="card feature"><h3>Safety</h3><p>No fabricated performance. No guaranteed profit. No live order execution from this research layer.</p></div><div class="card feature"><h3>Next integration</h3><p>Authentication, strategy storage, logs, proposals and controlled execution can be connected as separate layers.</p></div></div></div>`)}
show('Dashboard');
</script></body></html>

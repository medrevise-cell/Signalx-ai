
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>SignalX AI — Deriv Toolkit</title>
<style>
:root{color-scheme:dark;--bg:#09111e;--panel:#121e30;--line:#293950;--text:#eef5ff;--muted:#9aacc3;--green:#31d6a0;--amber:#ffca66;--red:#ff7185;--blue:#75b2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
header{padding:17px 20px;background:#0d1727;border-bottom:1px solid var(--line)}
.brand{font-size:23px;font-weight:bold}.brand span{color:var(--green)}
.status{float:right;font-size:12px;font-weight:bold;margin-top:7px;color:var(--amber)}
.sub{color:var(--muted);font-size:12px;margin-top:6px}
nav{display:flex;gap:7px;overflow-x:auto;padding:11px 15px;background:#0d1727;border-bottom:1px solid var(--line)}
button{font:inherit;cursor:pointer}
nav button,.btn{background:#18263a;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;white-space:nowrap}
nav button.active,.btn.primary{background:#145044;border-color:#267e6a}
button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1400px;margin:auto;padding:18px}
h1{font-size:24px;margin:5px 0 8px}h2{font-size:17px;margin:0 0 13px}h3{font-size:14px}
p{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:16px 0}
.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:13px}
.panel,.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0;margin-bottom:13px}
.metric small{display:block;color:var(--muted);margin-bottom:10px}
.metric strong{font-size:20px;overflow-wrap:anywhere}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input,select,textarea{width:100%;background:#0a1423;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:15px 0}
.quick button{white-space:normal;min-height:48px}
.barline{display:grid;grid-template-columns:20px 1fr 55px;gap:8px;align-items:center;margin:10px 0}
.bar{height:9px;background:#26364b;border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green)}
table{border-collapse:collapse;width:100%}td,th{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{color:var(--muted)}
.tablewrap{overflow-x:auto}
canvas{width:100%;height:190px;display:block}
.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:6px 9px;color:var(--muted);font-size:11px}
.note{background:#252219;border-left:3px solid var(--amber);padding:10px;margin:12px 0;color:#e7d5a8;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
#message{font-size:12px;color:var(--muted);margin:12px 0;overflow-wrap:anywhere}
.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:440px){main{padding:11px}.panel,.metric{padding:11px}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr}.brand{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="brand">⚡ SignalX <span>AI</span></div>
  <div id="connection" class="status">● CHECKING BACKEND</div>
  <div class="sub">DERIV TOOLKIT · REAL-DATA RESEARCH · ORDERS DISABLED</div>
</header>
<nav id="nav"></nav>
<main>
  <div id="page"></div>
  <div id="message" role="status" aria-live="polite">Starting connection checks…</div>
  <p>Research tool only. Historical frequencies are not predictions. No real-money orders are placed by this dashboard.</p>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const markets = [
  ["Volatility 10","R_10"],
  ["Volatility 25","R_25"],
  ["Volatility 50","R_50"],
  ["Volatility 75","R_75"],
  ["Volatility 100","R_100"],
  ["Volatility 10 (1s)","1HZ10V"],
  ["Volatility 25 (1s)","1HZ25V"],
  ["Volatility 50 (1s)","1HZ50V"],
  ["Volatility 75 (1s)","1HZ75V"],
  ["Volatility 100 (1s)","1HZ100V"]
];

const modules = [
  ["Dashboard","🏠"],["Bot Builder","⚙️"],["Free Bots","🆓"],
  ["Pro Scanner","📡"],["Strategy Pro","🧪"],["Speedbot","⚡"],
  ["AI Software","🧠"],["Auto Trader","🤖"],["Analysis Tool","🔢"],
  ["Manual Trade","🎯"],["Bulk Trade","📦"],["Charts","📈"],
  ["Copy Trade","👥"],["Risk Calculator","🧮"],["Trade Academy","🎓"]
];

const S = {
  page:"Dashboard",symbol:"1HZ10V",backend:false,feed:"Disconnected",
  ticks:[],history:[],times:[],quote:null,digit:null,socket:null,
  wins:0,losses:0,log:[],selectedDigit:5,
  stake:1,takeProfit:5,stopLoss:3,cooldown:30,maxLosses:3
};

const market = () => markets.find(m=>m[1]===S.symbol)||markets[5];
const money = n => "$"+Number(n).toFixed(2);
const say = t => { if($("message")) $("message").textContent=t; };
const esc = v => String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function options(){
  return markets.map(m=>`<option value="${m[1]}" ${m[1]===S.symbol?"selected":""}>${m[0]}</option>`).join("");
}

function navigate(name){
  S.page=name;
  drawNav();
  render();
}

function drawNav(){
  $("nav").innerHTML=modules.map(([n,e])=>
    `<button data-nav="${esc(n)}" class="${S.page===n?"active":""}">${e} ${esc(n)}</button>`
  ).join("");
  $("nav").querySelectorAll("[data-nav]").forEach(b=>
    b.addEventListener("click",()=>navigate(b.dataset.nav))
  );
}

function metrics(){
  return `<div class="grid">
    <div class="metric"><small>RESEARCH STATUS</small><strong class="warn">WAIT</strong></div>
    <div class="metric"><small>SELECTED MARKET</small><strong style="font-size:15px">${esc(market()[0])}</strong></div>
    <div class="metric"><small>LATEST QUOTE</small><strong>${S.quote===null?"—":esc(S.quote)}</strong></div>
    <div class="metric"><small>LAST OBSERVED DIGIT</small><strong>${S.digit===null?"—":S.digit}</strong></div>
  </div>`;
}

function frequency(){
  const counts=Array(10).fill(0);
  S.ticks.forEach(t=>{if(Number.isInteger(t.digit))counts[t.digit]++});
  const n=S.ticks.length;
  return `<section class="panel"><h2>🔢 Final-digit frequency</h2>
    <p>${n} observations currently in memory. Frequencies describe this sample only.</p>
    ${counts.map((v,d)=>`<div class="barline"><b>${d}</b>
      <div class="bar"><span style="width:${n?v/n*100:0}%"></span></div>
      <span>${n?(v/n*100).toFixed(1):"0.0"}%</span></div>`).join("")}
  </section>`;
}

function analysis(){
  const t=S.ticks,n=t.length,den=n||1;
  const even=t.filter(x=>x.digit%2===0).length;
  const under=t.filter(x=>x.digit<5).length;
  const matches=t.filter(x=>x.digit===S.selectedDigit).length;
  let rises=0,falls=0,unchanged=0;
  for(let i=1;i<n;i++){
    if(t[i].quote>t[i-1].quote)rises++;
    else if(t[i].quote<t[i-1].quote)falls++;
    else unchanged++;
  }
  return `<section class="panel"><h2>📊 Observed analysis</h2>
    <div class="row"><div><label>Match digit</label><select id="matchDigit">
      ${Array.from({length:10},(_,i)=>`<option value="${i}" ${i===S.selectedDigit?"selected":""}>${i}</option>`).join("")}
    </select></div><div><label>Sample size</label><input readonly value="${n}"></div></div>
    <div class="tablewrap"><table><thead><tr><th>Measure</th><th>Count</th><th>Sample share</th></tr></thead><tbody>
    <tr><td>Even</td><td>${even}</td><td>${(even/den*100).toFixed(1)}%</td></tr>
    <tr><td>Odd</td><td>${n-even}</td><td>${((n-even)/den*100).toFixed(1)}%</td></tr>
    <tr><td>Under 5 (0–4)</td><td>${under}</td><td>${(under/den*100).toFixed(1)}%</td></tr>
    <tr><td>5 or above</td><td>${n-under}</td><td>${((n-under)/den*100).toFixed(1)}%</td></tr>
    <tr><td>Matches ${S.selectedDigit}</td><td>${matches}</td><td>${(matches/den*100).toFixed(1)}%</td></tr>
    <tr><td>Differs from ${S.selectedDigit}</td><td>${n-matches}</td><td>${((n-matches)/den*100).toFixed(1)}%</td></tr>
    <tr><td>Rise / Fall / unchanged</td><td>${rises} / ${falls} / ${unchanged}</td><td>Descriptive</td></tr>
    </tbody></table></div>
    <p>Observed percentages are not probabilities of winning the next contract.</p>
  </section>`;
}

function chart(){
  return `<section class="panel"><h2>📈 Quote chart</h2>
    <canvas id="priceChart" width="760" height="190"></canvas>
    <p>Recent historical and live quotes received from the backend.</p>
  </section>`;
}

function marketPicker(){
  return `<label>Market</label><select id="marketSelect">${options()}</select>`;
}

function dashboard(){
  return `<h1>SignalX Command Center</h1>
    <p>Research scanner · Live data status · Strategy workspace</p>
    ${metrics()}
    <div class="quick">${modules.slice(1).map(([n,e])=>
      `<button data-open="${esc(n)}">${e} ${esc(n)}</button>`).join("")}</div>
    <div class="layout"><div>${frequency()}${chart()}</div><div>${analysis()}
      <section class="panel"><h2>System status</h2>
      <p>Backend: <b class="${S.backend?"good":"bad"}">${S.backend?"Connected":"Unavailable"}</b></p>
      <p>Live feed: <b>${esc(S.feed)}</b></p>
      <p>Session ticks: <b>${S.ticks.length}</b></p>
      <p>Manually logged paper results: <b>${S.wins} wins / ${S.losses} losses</b></p>
      <span class="pill">REAL ORDERS DISABLED</span>
      </section></div></div>`;
}

function botBuilder(){
  return `<h1>⚙️ Bot Builder</h1>
    <p>Set up a research plan. Saving settings does not start a bot or place an order.</p>
    <div class="layout"><section class="panel">
      <h2>1. Trade parameters</h2>${marketPicker()}
      <label>Contract type</label><select id="contractType">
        <option>Even / Odd</option><option>Over / Under</option>
        <option>Matches / Differs</option><option>Rise / Fall</option>
      </select>
      <div class="row">
        <div><label>Stake reference ($)</label><input id="stake" type="number" min="0" step=".01" value="${S.stake}"></div>
        <div><label>Minimum observations</label><input id="sampleMin" type="number" min="10" value="100"></div>
      </div>
      <h2 style="margin-top:20px">2. Risk controls</h2>
      <div class="row">
        <div><label>Take-profit reference ($)</label><input id="tp" type="number" min="0" step=".01" value="${S.takeProfit}"></div>
        <div><label>Stop-loss reference ($)</label><input id="sl" type="number" min="0" step=".01" value="${S.stopLoss}"></div>
      </div>
      <div class="row">
        <div><label>Cooldown seconds</label><input id="cooldown" type="number" min="0" value="${S.cooldown}"></div>
        <div><label>Loss limit</label><input id="maxLosses" type="number" min="1" value="${S.maxLosses}"></div>
      </div>
      <div class="note">Fixed-stake planning only. Martingale and automatic trading are not implemented.</div>
      <button class="btn primary" id="saveSettings">Save settings</button>
    </section><section class="panel">
      <h2>3. Purchase conditions</h2>
      <p>Current market: <b>${esc(market()[0])}</b></p>
      <p>Observed samples: <b>${S.ticks.length}</b></p>
      <p>Latest digit: <b>${S.digit===null?"—":S.digit}</b></p>
      <h2>4. Restart conditions</h2>
      <p>Configured cooldown: ${S.cooldown} seconds</p>
      <p>Configured loss limit: ${S.maxLosses}</p>
      <div class="note">No real prediction or purchase signal is being generated by these settings.</div>
      <span class="pill">RESEARCH MODE</span>
    </section></div>`;
}

function scanner(){
  return `<h1>📡 ${esc(S.page)}</h1><p>Market statistics calculated from available observations.</p>
    <section class="panel">${marketPicker()}
      <p>Feed status: <b>${esc(S.feed)}</b></p>
      ${metrics()}
      <div class="actions"><button class="btn primary" id="reloadHistory">Reload history</button>
      <button class="btn" id="reconnect">Reconnect live feed</button></div>
    </section>
    <div class="layout"><div>${frequency()}${chart()}</div><div>${analysis()}</div></div>`;
}

function manual(){
  return `<h1>🎯 Manual Trade Research</h1>
    <p>Review observations and log hypothetical results. This interface does not submit trades.</p>
    ${metrics()}<section class="panel">
    <h2>Research worksheet</h2>
    <p>Current status: <b class="warn">WAIT — no validated edge assumed</b></p>
    <label>Research note</label><textarea id="researchNote" rows="3" placeholder="Describe the setup and your reasoning"></textarea>
    <div class="actions"><button class="btn" id="paperWin">Log paper win</button>
    <button class="btn" id="paperLoss">Log paper loss</button>
    <button class="btn primary" id="saveNote">Save note</button></div>
    <h2 style="margin-top:20px">Session log</h2>
    <div>${S.log.length?S.log.map(x=>`<p>${esc(x)}</p>`).join(""):"<p>No entries recorded.</p>"}</div>
    </section>`;
}

function riskCalculator(){
  return `<h1>🧮 Risk Calculator</h1>
    <p>Illustrative risk-budget calculations, not payout or profit predictions.</p>
    <section class="panel"><div class="row">
      <div><label>Balance ($)</label><input id="balance" type="number" min="0" value="100"></div>
      <div><label>Risk budget (%)</label><input id="riskPct" type="number" min="0" max="100" value="1"></div>
    </div><div class="actions"><button class="btn primary" id="calcRisk">Calculate</button></div>
    <h2 id="riskResult">Illustrative budget: $1.00</h2></section>`;
}

function otherPage(){
  const descriptions={
    "Free Bots":"Explore fixed-rule research templates. No bot executes trades.",
    "Strategy Pro":"Use historical observations to plan backtests and validation.",
    "Speedbot":"Monitor feed responsiveness and recent tick changes.",
    "AI Software":"Review statistical evidence and limitations. No validated AI edge is claimed.",
    "Auto Trader":"Automation workspace. Real-money order execution is disabled.",
    "Bulk Trade":"Plan hypothetical scenarios without submitting orders.",
    "Charts":"Inspect recent market quotes and historical observations.",
    "Copy Trade":"Document strategy-copy ideas. No accounts or trades are copied.",
    "Trade Academy":"Study probability, sample sizes, overfitting, and risk management."
  };
  return `<h1>${esc(S.page)}</h1><section class="panel">
    <h2>${esc(S.page)} workspace</h2>
    <p>${esc(descriptions[S.page]||"Research tools for observing market data.")}</p>
    ${metrics()}<p>Market: ${esc(market()[0])}</p>
    <div class="actions"><button class="btn primary" data-open="Pro Scanner">Open Pro Scanner</button>
    <button class="btn" data-open="Analysis Tool">Open Analysis Tool</button>
    <button class="btn" data-open="Risk Calculator">Open Risk Calculator</button></div>
  </section>`;
}

function render(){
  const p=S.page;
  $("page").innerHTML=
    p==="Dashboard"?dashboard():
    p==="Bot Builder"?botBuilder():
    p==="Pro Scanner"||p==="Analysis Tool"||p==="Charts"?scanner():
    p==="Manual Trade"?manual():
    p==="Risk Calculator"?riskCalculator():otherPage();
  bindPage();
  drawChart();
}

function bindPage(){
  document.querySelectorAll("[data-open]").forEach(b=>
    b.addEventListener("click",()=>navigate(b.dataset.open))
  );
  const ms=$("marketSelect");
  if(ms)ms.addEventListener("change",async()=>{
    S.symbol=ms.value;
    S.ticks=[];S.history=[];S.quote=null;S.digit=null;
    await loadHistory();
    connectLive();
    render();
  });
  const md=$("matchDigit");
  if(md)md.addEventListener("change",()=>{S.selectedDigit=Number(md.value);render()});

  const save=$("saveSettings");
  if(save)save.addEventListener("click",()=>{
    S.stake=Math.max(0,Number($("stake").value)||0);
    S.takeProfit=Math.max(0,Number($("tp").value)||0);
    S.stopLoss=Math.max(0,Number($("sl").value)||0);
    S.cooldown=Math.max(0,Number($("cooldown").value)||0);
    S.maxLosses=Math.max(1,Number($("maxLosses").value)||1);
    say("Settings saved for this page session. No bot was started.");
    render();
  });

  const reload=$("reloadHistory");
  if(reload)reload.addEventListener("click",loadHistory);
  const reconnect=$("reconnect");
  if(reconnect)reconnect.addEventListener("click",connectLive);

  const win=$("paperWin");
  if(win)win.addEventListener("click",()=>logResult("Paper win"));
  const loss=$("paperLoss");
  if(loss)loss.addEventListener("click",()=>logResult("Paper loss"));
  const note=$("saveNote");
  if(note)note.addEventListener("click",()=>{
    const v=$("researchNote").value.trim();
    if(v)S.log.unshift("Note: "+v);
    render();
  });

  const calc=$("calcRisk");
  if(calc)calc.addEventListener("click",()=>{
    const balance=Math.max(0,Number($("balance").value)||0);
    const pct=Math.min(100,Math.max(0,Number($("riskPct").value)||0));
    $("riskResult").textContent="Illustrative budget: "+money(balance*pct/100);
  });
}

function logResult(result){
  if(result==="Paper win")S.wins++;
  else S.losses++;
  S.log.unshift(new Date().toLocaleTimeString()+" — "+result+" (manually recorded)");
  render();
}

async function checkBackend(){
  const badge=$("connection");
  try{
    const response=await fetch(new URL("/api/health",location.origin).href,{
      method:"GET",cache:"no-store",headers:{"Accept":"application/json"}
    });
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await response.json();
    if(data.ok!==true)throw new Error("Health response did not contain ok:true");
    S.backend=true;
    badge.textContent="● BACKEND ONLINE";
    badge.style.color="var(--green)";
    if(S.page==="Dashboard"){
      const label=$("message");
      if(label && !label.textContent.startsWith("History unavailable"))
        say("Backend online · Mode: "+(data.mode||"research")+" · Real-money trading: disabled.");
    }
  }catch(error){
    S.backend=false;
    badge.textContent="● BACKEND OFFLINE";
    badge.style.color="var(--red)";
    say("Backend health check failed: "+error.message);
    console.error("SignalX /api/health:",error);
  }
}

function extractDigit(value){
  // Preserve a quote's original text when the feed provides it as a string.
  const digits=String(value).replace(/\D/g,"");
  return digits.length?Number(digits[digits.length-1]):null;
}

async function loadHistory(){
  say("Loading historical data for "+market()[0]+"…");
  try{
    const url="/api/history?symbol="+encodeURIComponent(S.symbol)+"&count=500";
    const response=await fetch(url,{cache:"no-store"});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"HTTP "+response.status);
    if(data.error)throw new Error(data.error.message||data.error);

    const h=data.history||data;
    const prices=h.prices||data.prices;
    const times=h.times||data.times;
    if(!Array.isArray(prices))throw new Error("Backend response has no history.prices array.");

    S.history=prices.map(Number).filter(Number.isFinite);
    S.times=Array.isArray(times)?times:[];
    S.ticks=S.history.map(q=>({quote:q,digit:extractDigit(q)})).filter(t=>t.digit!==null);
    if(S.ticks.length){
      S.quote=S.ticks[S.ticks.length-1].quote;
      S.digit=S.ticks[S.ticks.length-1].digit;
    }
    say("Historical data received: "+S.ticks.length+" observations for "+market()[0]+".");
    render();
  }catch(error){
    say("History unavailable for "+market()[0]+": "+error.message);
    console.error("SignalX history:",error);
  }
}

function connectLive(){
  if(S.socket){
    try{S.socket.onclose=null;S.socket.close()}catch(e){}
    S.socket=null;
  }
  if(!S.backend){
    S.feed="Backend unavailable";
    say("Live feed not started because backend health check has not succeeded.");
    return;
  }
  const scheme=location.protocol==="https:"?"wss:":"ws:";
  const socket=new WebSocket(scheme+"//"+location.host+"/live?symbol="+encodeURIComponent(S.symbol));
  S.socket=socket;
  S.feed="Connecting";
  socket.onopen=()=>{
    S.feed="Connected; waiting for tick";
    say("WebSocket connected. Waiting for first market tick…");
  };
  socket.onmessage=event=>{
    try{
      const data=JSON.parse(event.data);
      if(data.error){
        S.feed="Feed error";
        say("Deriv feed error: "+(data.error.message||"unknown error"));
        return;
      }
      const tick=data.tick;
      if(!tick||tick.quote===undefined)return;
      const quote=Number(tick.quote);
      const digit=extractDigit(tick.quote);
      if(!Number.isFinite(quote)||digit===null)return;
      S.quote=tick.quote;
      S.digit=digit;
      S.feed="Receiving live ticks";
      S.ticks.push({quote,digit});
      S.history.push(quote);
      if(S.ticks.length>1000)S.ticks.shift();
      if(S.history.length>500)S.history.shift();
      if(["Dashboard","Pro Scanner","Analysis Tool","Charts","Manual Trade"].includes(S.page)){
        render();
      }
    }catch(error){
      console.error("SignalX live message:",error);
    }
  };
  socket.onerror=()=>{
    S.feed="Connection error";
    say("Live WebSocket failed. Check the backend /live route and allowed symbol.");
  };
  socket.onclose=()=>{
    if(S.socket===socket){
      S.feed="Disconnected";
      say("Live feed disconnected. Use Reconnect live feed to try again.");
    }
  };
}

function drawChart(){
  const canvas=$("priceChart");
  if(!canvas)return;
  const ctx=canvas.getContext("2d");
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#293950";
  for(let i=1;i<5;i++){
    ctx.beginPath();ctx.moveTo(0,h*i/5);ctx.lineTo(w,h*i/5);ctx.stroke();
  }
  const values=S.history.slice(-100);
  if(values.length<2){
    ctx.fillStyle="#9aacc3";ctx.font="14px Arial";
    ctx.fillText("Waiting for quote data…",15,35);
    return;
  }
  const min=Math.min(...values),max=Math.max(...values),range=max-min||1;
  ctx.beginPath();ctx.strokeStyle="#31d6a0";ctx.lineWidth=2;
  values.forEach((v,i)=>{
    const x=i*w/(values.length-1);
    const y=h-12-(v-min)/range*(h-24);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
}

drawNav();
render();
checkBackend().then(()=>{
  if(S.backend){
    loadHistory().then(()=>connectLive());
  }
});
setInterval(checkBackend,60000);
</script>
</body>
